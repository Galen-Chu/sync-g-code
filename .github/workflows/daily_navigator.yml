name: Daily Spiritual Navigator

on:
  schedule:
    # 每天台灣時間早上 8:23 執行 (UTC 0:23)——刻意離開整點，
    # 避開 GitHub Actions 排程尖峰（實測整點延遲可達 3～5 小時）
    - cron: '23 0 * * *'
  workflow_dispatch: # 允許手動觸發測試

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Navigator Script
        id: navigator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
          echo "REPORT_DATE=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"

      - name: Upload daily notes artifact
        # 給 Obsidian_Library 的 import-reports 管線抓取（pull 模型，
        # 契約見該庫 raw/reports/README.md；檔名需 YYYY-MM-DD_ 前綴）
        uses: actions/upload-artifact@v4
        with:
          name: daily-notes-gcode-${{ steps.navigator.outputs.REPORT_DATE }}
          path: out/
          retention-days: 14
          if-no-files-found: error
